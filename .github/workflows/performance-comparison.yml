name: Generate performance report

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This artifact identifies which pull request should receive the generated report.
  context:
    name: Save pull request context
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Save pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/performance-context"
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/performance-context/pr-number.txt"

      - name: Publish pull request context
        uses: actions/upload-artifact@v4
        with:
          name: performance-pr-context
          path: ${{ runner.temp }}/performance-context/

  compare:
    name: Generate performance report (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-latest
            artifact: linux-x64
          - platform: macOS ARM64
            runner: macos-14
            artifact: macos-arm64
    steps:
      - name: Check out base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - name: Check out PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          components: native-image
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install performance-script dependencies
        run: python -m pip install PyYAML

      - name: Build base native executable
        working-directory: base
        run: mvn --batch-mode -Pnative package -DskipTests -pl dartagnan

      - name: Build PR native executable
        working-directory: head
        run: mvn --batch-mode -Pnative package -DskipTests -pl dartagnan

      - name: Compare performance
        run: |
          mkdir -p performance
          python head/scripts/compare_performance.py \
            --benchmarks head/.github/performance-benchmarks.yml \
            --base-checkout "$GITHUB_WORKSPACE/base" \
            --head-checkout "$GITHUB_WORKSPACE/head" \
            --timeout 180 \
            --jobs 1 \
            --min-average-seconds 5 \
            --markdown performance/report.md \
            --json performance/results.json

      - name: Publish performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison-${{ matrix.artifact }}
          path: performance/
